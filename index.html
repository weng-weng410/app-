<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI 計算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BMI 計算器</h1>
        
        <div class="input-group">
            <label for="height">身高 (cm):</label>
            <input type="number" id="height" placeholder="請輸入身高" step="0.1">
        </div>
        
        <div class="input-group">
            <label for="weight">體重 (kg):</label>
            <input type="number" id="weight" placeholder="請輸入體重" step="0.1">
        </div>
        
        <button id="calculateBtn">計算 BMI</button>
        <button id="resetBtn" class="reset-btn">重置</button>
        
        <div id="result" class="result">
            <div id="bmiValue">--</div>
            <div id="bmiCategory">--</div>
        </div>
        
        <div class="bmi-info">
            <h3>BMI 分類標準：</h3>
            <ul>
                <li><span class="cat-underweight">過輕：</span> BMI < 18.5</li>
                <li><span class="cat-normal">正常：</span> 18.5 ≤ BMI < 24</li>
                <li><span class="cat-overweight">過重：</span> 24 ≤ BMI < 27</li>
                <li><span class="cat-obese">肥胖：</span> BMI ≥ 27</li>
            </ul>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
